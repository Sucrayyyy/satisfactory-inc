<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Satisfactory">
<meta name="theme-color" content="#FFD9E4">
<meta name="description" content="Satisfactory Inc. — le jeu le plus satisfaisant du monde. Pop it, film plastique, clavier, squishy, sable cinétique, papier bulle. Niveaux infinis.">
<title>Satisfactory Inc.</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="probe"></div>
<canvas id="stage"></canvas>

<header class="hud" id="hud">
  <button class="glass pill iconbtn" id="btnHome" aria-label="Accueil">
    <svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5h-6v5H5.5A1.5 1.5 0 0 1 4 19z"/></svg>
  </button>
  <button class="glass pill iconbtn" id="btnGear" aria-label="Réglages">
    <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.2 5-.1-3 2-1.6-2-3.4-2.4.9a8 8 0 0 0-2.6-1.5L14.7 2h-4l-.5 2.5a8 8 0 0 0-2.6 1.5L5.2 5.1l-2 3.4 2 1.6a8 8 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a8 8 0 0 0 2.6 1.5l.5 2.5h4l.4-2.5a8 8 0 0 0 2.6-1.5l2.4.9 2-3.4z"/></svg>
  </button>
  <div class="glass pill" id="lvlPill"><span id="lvlText">Niveau 1</span><span class="dots" id="dots"></span></div>
  <div class="spacer"></div>
  <div class="glass pill" id="coinPill"><span class="bub"></span><span id="coinText">0</span></div>
</header>

<div class="glass pill" id="hint"></div>
<div class="glass" id="banner"></div>

<section class="screen" id="home">
  <div class="logo" id="logo" aria-label="satisfactory inc."></div>
  <div class="tagline" id="tagline">Département du Bien-être Tactile</div>
  <div class="grow"></div>
  <div class="home-actions" id="homeActions">
    <div class="rankrow glass">
      <div class="rk"><b id="rankName">Stagiaire</b><small id="rankNext"></small></div>
      <div class="bar"><i id="rankBar"></i></div>
    </div>
    <button class="btn primary big" id="btnPlay"><span>Jouer</span><small id="playLvl">Niveau 1</small></button>
    <div class="row">
      <button class="btn glass" id="btnZen">
        <svg viewBox="0 0 24 24"><path d="M12 3c3 3.5 3 7.5 0 11-3-3.5-3-7.5 0-11Zm-8 8c3.6 0 6.4 1.6 8 5 1.6-3.4 4.4-5 8-5-.4 5-3.8 9-8 9s-7.6-4-8-9Z"/></svg>Zen</button>
      <button class="btn glass" id="btnShop">
        <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7zm3 0a3 3 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>Atelier</button>
      <button class="btn glass" id="btnGift">
        <svg viewBox="0 0 24 24"><path d="M4 10h16v4H4zm1.5 4h13v6h-13zM12 10v10M12 10C10 6 6.5 6 7 8.5S12 10 12 10Zm0 0c2-4 5.5-4 5-1.5S12 10 12 10Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>Cadeau<i class="badge"></i></button>
    </div>
  </div>
</section>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="glass pill iconbtn" id="sheetClose" aria-label="Fermer">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg></button></div>
  <div id="sheetBody"></div>
</section>

<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
